<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rough Metal 3D Extruder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        canvas {
            max-width: 100%;
            max-height: 65vh;
            object-fit: contain;
            cursor: grab;
            touch-action: none;
        }

        canvas:active {
            cursor: grabbing;
        }

        .glass-panel {
            background: rgba(20, 20, 30, 0.85);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>

<body class="bg-[#050508] text-slate-200 min-h-screen flex flex-col items-center p-4">

    <header class="text-center mb-6">
        <h1 class="text-3xl font-black italic tracking-tighter text-white">TEXTURED METAL 3D</h1>
        <p class="text-blue-400 text-[9px] uppercase tracking-[0.6em] font-bold">Physical Roughness Rendering</p>
    </header>

    <div
        class="relative w-full max-w-5xl flex justify-center items-center mb-6 bg-black rounded-3xl p-1 border border-white/10 shadow-[0_0_100px_rgba(59,130,246,0.15)] overflow-hidden aspect-video">
        <div id="loading-overlay"
            class="hidden absolute inset-0 bg-black/90 z-50 flex flex-col justify-center items-center">
            <div class="w-10 h-10 border-2 border-blue-500/20 border-t-blue-500 rounded-full animate-spin mb-4"></div>
            <p class="text-[9px] font-bold tracking-widest text-blue-400 uppercase">Generating Metallic Geometry...</p>
        </div>
        <canvas id="main-canvas" class="w-full h-full"></canvas>
    </div>

    <div class="w-full max-w-5xl glass-panel p-6 rounded-3xl grid grid-cols-1 md:grid-cols-4 gap-8 shadow-2xl">

        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest border-b border-white/5 pb-2">
                Character</h3>
            <input type="text" id="text-input" value="魂"
                class="w-full bg-black/50 border border-white/20 rounded-xl p-3 text-3xl text-center outline-none focus:border-blue-500 text-white transition-all">
            <select id="font-family"
                class="w-full bg-neutral-800 border border-white/10 rounded-xl p-2 text-sm text-white outline-none cursor-pointer">
                <option value="serif">明朝体 (Serif)</option>
                <option value="sans-serif">ゴシック (Sans)</option>
            </select>
        </div>

        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest border-b border-white/5 pb-2">
                Rough Metal Presets</h3>
            <div class="grid grid-cols-2 gap-2">
                <button onclick="applyPreset('#D4AF37', 0.22, 1.8)"
                    class="bg-[#D4AF37] text-black font-black py-2 rounded-lg text-[9px] uppercase hover:brightness-110 transition-all shadow-lg">Satin
                    Gold</button>
                <button onclick="applyPreset('#C0C0C0', 0.18, 2.0)"
                    class="bg-[#C0C0C0] text-black font-black py-2 rounded-lg text-[9px] uppercase hover:brightness-110 transition-all shadow-lg">Brushed
                    Steel</button>
                <button onclick="applyPreset('#B87333', 0.25, 1.6)"
                    class="bg-[#B87333] text-white font-black py-2 rounded-lg text-[9px] uppercase hover:brightness-110 transition-all shadow-lg">Raw
                    Copper</button>
                <button onclick="applyPreset('#444444', 0.35, 2.5)"
                    class="bg-[#444] text-white font-black py-2 rounded-lg text-[9px] uppercase hover:brightness-110 transition-all shadow-lg">Cast
                    Iron</button>
            </div>
        </div>

        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-neutral-500 uppercase tracking-widest border-b border-white/5 pb-2">
                Surface Settings</h3>
            <div>
                <label class="flex justify-between text-[10px] text-neutral-400 mb-2 uppercase font-bold">Roughness
                    <span id="rough-val">0.22</span></label>
                <input type="range" id="rough-range" min="0.01" max="0.6" step="0.01" value="0.22"
                    class="w-full accent-blue-500">
            </div>
            <div>
                <label class="flex justify-between text-[10px] text-neutral-400 mb-2 uppercase font-bold">Depth <span
                        id="depth-val">2.0</span></label>
                <input type="range" id="depth-range" min="0.1" max="5.0" step="0.1" value="2.0"
                    class="w-full accent-blue-500">
            </div>
        </div>

        <div class="flex flex-col justify-end space-y-4">
            <div class="flex items-center space-x-2 text-[10px] text-blue-400 font-bold uppercase">
                <span>Auto-Rotation</span>
                <input type="checkbox" id="rotate-toggle" checked class="w-4 h-4 accent-blue-500">
            </div>
            <button id="regen-btn"
                class="w-full bg-white text-black font-black py-4 rounded-2xl uppercase text-[11px] tracking-[0.2em] transition-all hover:bg-blue-500 hover:text-white active:scale-95 shadow-xl">Update
                Texture</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, currentMesh, envMap, noiseTexture;
        let currentColor = new THREE.Color(0xD4AF37);
        let currentRoughness = 0.22;
        let currentExposure = 1.8;
        let isDragging = false, prevMouse = { x: 0, y: 0 };
        let retryCount = 0;

        async function init() {
            const canvas = document.getElementById('main-canvas');
            if (!canvas) return;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(30, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            camera.position.set(0, 0, 50);

            renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
            renderer.setPixelRatio(window.devicePixelRatio);
            renderer.setSize(canvas.clientWidth, canvas.clientHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = currentExposure;
            renderer.outputEncoding = THREE.sRGBEncoding;

            // --- ノイズテクスチャの生成 ---
            const noiseSize = 256;
            const noiseCanvas = document.createElement('canvas');
            noiseCanvas.width = noiseCanvas.height = noiseSize;
            const nCtx = noiseCanvas.getContext('2d');
            for (let i = 0; i < noiseSize; i++) {
                for (let j = 0; j < noiseSize; j++) {
                    const val = Math.floor(Math.random() * 255);
                    nCtx.fillStyle = `rgb(${val},${val},${val})`;
                    nCtx.fillRect(i, j, 1, 1);
                }
            }
            noiseTexture = new THREE.CanvasTexture(noiseCanvas);
            noiseTexture.wrapS = noiseTexture.wrapT = THREE.RepeatWrapping;
            noiseTexture.repeat.set(5, 5);

            // --- 環境マップの生成 ---
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            const envScene = new THREE.Scene();
            const skyGeo = new THREE.SphereGeometry(100, 32, 32);
            const skyMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.BackSide });
            envScene.add(new THREE.Mesh(skyGeo, skyMat));

            const lightGeo = new THREE.PlaneGeometry(50, 50);
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const p1 = new THREE.Mesh(lightGeo, lightMat);
            p1.position.set(0, 50, 50); p1.lookAt(0, 0, 0); envScene.add(p1);

            envMap = pmremGenerator.fromScene(envScene).texture;

            // 照明
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));
            const mainLight = new THREE.DirectionalLight(0xffffff, 2);
            mainLight.position.set(10, 20, 30);
            scene.add(mainLight);

            setupEvents();
            animate();

            // 初期描画
            try {
                const fontInput = document.getElementById('font-family');
                const font = `bold 100px ${fontInput ? fontInput.value : 'serif'}`;
                await document.fonts.load(font);
                await document.fonts.ready;
                setTimeout(() => generateSmoothKanji(), 300);
            } catch (e) {
                generateSmoothKanji();
            }
        }

        function generateSmoothKanji() {
            const inputEl = document.getElementById('text-input');
            const fontEl = document.getElementById('font-family');
            const depthEl = document.getElementById('depth-range');
            const loading = document.getElementById('loading-overlay');

            if (!inputEl || !fontEl) return;

            const text = inputEl.value.trim().substring(0, 1) || "魂";
            const fontFamily = fontEl.value;
            const depth = depthEl ? parseFloat(depthEl.value) : 2.0;

            if (loading) loading.classList.remove('hidden');

            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = canvas.height = size;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = 'white';
            ctx.font = `bold ${size * 0.75}px ${fontFamily}, serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, size / 2, size / 2);

            const imgData = ctx.getImageData(0, 0, size, size).data;
            if (currentMesh) scene.remove(currentMesh);

            const material = new THREE.MeshStandardMaterial({
                color: currentColor,
                metalness: 1.0,
                roughness: currentRoughness,
                envMap: envMap,
                envMapIntensity: 2.5,
                bumpMap: noiseTexture,
                bumpScale: 0.05,
                emissive: currentColor,
                emissiveIntensity: 0.05
            });

            const shapes = [];
            const threshold = 128;
            const scale = 0.045;

            // 走査の最適化
            for (let y = 0; y < size; y += 2) {
                let start = -1;
                for (let x = 0; x < size; x++) {
                    const r = imgData[(y * size + x) * 4];
                    if (r > threshold) {
                        if (start === -1) start = x;
                    } else if (start !== -1) {
                        const shape = new THREE.Shape();
                        const xPos = (start - size / 2) * scale;
                        const yPos = -(y - size / 2) * scale;
                        const width = (x - start) * scale;
                        const height = scale * 2.1;

                        shape.moveTo(xPos, yPos);
                        shape.lineTo(xPos + width, yPos);
                        shape.lineTo(xPos + width, yPos - height);
                        shape.lineTo(xPos, yPos - height);
                        shapes.push(shape);
                        start = -1;
                    }
                }
            }

            if (shapes.length === 0 && retryCount < 1) {
                retryCount++;
                setTimeout(generateSmoothKanji, 200);
                return;
            }
            retryCount = 0;

            const extrudeSettings = {
                depth: depth,
                bevelEnabled: true,
                bevelThickness: 0.4,
                bevelSize: 0.3,
                bevelSegments: 6
            };

            currentMesh = new THREE.Group();
            shapes.forEach(shape => {
                const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const mesh = new THREE.Mesh(geo, material);
                currentMesh.add(mesh);
            });

            const box = new THREE.Box3().setFromObject(currentMesh);
            const center = box.getCenter(new THREE.Vector3());
            currentMesh.position.sub(center);

            scene.add(currentMesh);
            if (loading) loading.classList.add('hidden');
        }

        function applyPreset(hex, rough, exp) {
            currentColor.set(hex);
            currentRoughness = rough;
            currentExposure = exp;

            const rangeEl = document.getElementById('rough-range');
            const valEl = document.getElementById('rough-val');
            if (rangeEl) rangeEl.value = rough;
            if (valEl) valEl.innerText = rough;

            if (renderer) renderer.toneMappingExposure = exp;
            generateSmoothKanji();
        }

        function setupEvents() {
            const canvas = document.getElementById('main-canvas');
            if (!canvas) return;

            const handleMove = (x, y) => {
                if (isDragging && currentMesh) {
                    currentMesh.rotation.y += (x - prevMouse.x) * 0.01;
                    currentMesh.rotation.x += (y - prevMouse.y) * 0.01;
                    prevMouse = { x, y };
                }
            };

            canvas.onmousedown = (e) => { isDragging = true; prevMouse = { x: e.clientX, y: e.clientY }; };
            window.onmouseup = () => isDragging = false;
            window.onmousemove = (e) => handleMove(e.clientX, e.clientY);

            canvas.ontouchstart = (e) => { isDragging = true; prevMouse = { x: e.touches[0].clientX, y: e.touches[0].clientY }; };
            window.ontouchend = () => isDragging = false;
            window.ontouchmove = (e) => handleMove(e.touches[0].clientX, e.touches[0].clientY);

            const regenBtn = document.getElementById('regen-btn');
            if (regenBtn) regenBtn.onclick = generateSmoothKanji;

            const depthRange = document.getElementById('depth-range');
            if (depthRange) {
                depthRange.oninput = (e) => {
                    const valDisp = document.getElementById('depth-val');
                    if (valDisp) valDisp.innerText = e.target.value;
                    // スライダーを離さなくてもリアルタイムで反映させたい場合はここに追加可能ですが、負荷軽減のため今回は表示のみ
                };
            }

            const roughRange = document.getElementById('rough-range');
            if (roughRange) {
                roughRange.oninput = (e) => {
                    currentRoughness = parseFloat(e.target.value);
                    const valDisp = document.getElementById('rough-val');
                    if (valDisp) valDisp.innerText = currentRoughness;
                    if (currentMesh) {
                        currentMesh.children.forEach(m => {
                            m.material.roughness = currentRoughness;
                        });
                    }
                };
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const rotateToggle = document.getElementById('rotate-toggle');
            if (currentMesh && rotateToggle && rotateToggle.checked && !isDragging) {
                currentMesh.rotation.y += 0.008;
            }
            if (renderer && scene && camera) {
                renderer.render(scene, camera);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>

</html>

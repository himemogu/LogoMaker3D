<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Metallic Shader - Final Refined Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/SVGLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
    <style>
        canvas {
            max-width: 100%;
            max-height: 60vh;
            object-fit: contain;
            cursor: grab;
            touch-action: none;
            background-image: radial-gradient(#2d3748 1px, transparent 1px);
            background-size: 20px 20px;
        }

        canvas:active {
            cursor: grabbing;
        }

        .loading-overlay {
            display: none;
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        .btn-preset {
            font-size: 10px;
            font-weight: 900;
            padding: 8px;
            border-radius: 8px;
            text-transform: uppercase;
            transition: all 0.2s;
        }
    </style>
</head>

<body class="bg-[#0f172a] text-slate-200 min-h-screen flex flex-col items-center p-4">

    <header class="text-center mb-4">
        <h1 class="text-3xl font-black text-white tracking-tighter italic">METALLIC IRIDESCENCE</h1>
        <p class="text-blue-400 text-[10px] uppercase tracking-[0.5em] font-bold">Refined Japanese 3D Studio</p>
    </header>

    <div
        class="relative w-full max-w-5xl flex justify-center items-center mb-6 bg-black rounded-3xl p-1 border border-slate-800 shadow-2xl overflow-hidden aspect-video">
        <div id="loading" class="loading-overlay">
            <div class="flex flex-col items-center">
                <div class="w-10 h-10 border-2 border-blue-900 border-t-blue-400 rounded-full animate-spin"></div>
                <p id="loading-text" class="text-blue-400 font-bold text-[10px] mt-4 uppercase tracking-widest">
                    Processing...</p>
            </div>
        </div>
        <canvas id="main-canvas" class="rounded-2xl"></canvas>
    </div>

    <div
        class="w-full max-w-5xl bg-slate-900/50 backdrop-blur-md p-6 rounded-3xl border border-slate-800 grid grid-cols-1 md:grid-cols-4 gap-8 shadow-xl">

        <!-- Text & Style -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">
                Text & Style</h3>
            <div>
                <input type="text" id="text-input" value="黄金ロゴ制作"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:ring-2 ring-blue-500/50 text-white transition-all"
                    maxlength="15">
            </div>
            <div>
                <select id="font-select"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-white outline-none">
                    <optgroup label="日本語フォント">
                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/rocknrollone/RocknRollOne-Regular.ttf">
                            RocknRoll One (中太・おすすめ)</option>

                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/delagothicone/DelaGothicOne-Regular.ttf">
                            Dela Gothic One (極太)</option>


                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/mplusrounded1c/MPLUSRounded1c-Bold.ttf">
                            M PLUS Rounded 1c (丸ゴシック太字)</option>


                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/zenkakugothicnew/ZenKakuGothicNew-Bold.ttf">
                            Zen Kaku Gothic New (太字角ゴシック)</option>
                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/bizudgothic/BIZUDGothic-Bold.ttf">
                            BIZ UD Gothic (太字UDゴシック)</option>

                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/zenoldmincho/ZenOldMincho-Regular.ttf">
                            Zen Old Mincho (古典明朝)</option>
                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/dotgothic16/DotGothic16-Regular.ttf">
                            DotGothic16 (ドットゴシック)</option>
                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/hachimarupop/HachiMaruPop-Regular.ttf">
                            Hachi Maru Pop (手書きポップ)</option>
                        <option
                            value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/kaiseidecol/KaiseiDecol-Regular.ttf">
                            Kaisei Decol (装飾書体)</option>
                        <option value="https://cdn.jsdelivr.net/gh/google/fonts@main/ofl/yomogi/Yomogi-Regular.ttf">
                            Yomogi (手書き風)</option>




                    </optgroup>
                    <optgroup label="英字フォント (Three.js FontLoader)">
                        <option value="helvetiker_bold">Helvetiker (Standard)</option>
                        <option value="gentilis_bold">Gentilis (Classic)</option>
                        <option value="optimer_bold">Optimer (Sharp)</option>
                        <option
                            value="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/fonts/droid/droid_sans_bold">
                            Droid Sans (Roboto-like)</option>
                        <option value="https://cdn.rawgit.com/mrdoob/three.js/master/examples/fonts/helvetiker_regular">
                            Regular Light</option>
                        <option
                            value="https://raw.githubusercontent.com/mrdoob/three.js/master/examples/fonts/droid/droid_serif_bold">
                            Droid Serif (Academic)</option>
                    </optgroup>
                </select>
            </div>
            <div>
                <label class="text-[10px] text-slate-400 mb-2 uppercase font-bold">Shape</label>
                <select id="shape-select"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-[10px] text-white outline-none">
                    <option value="text">3D Text Mode</option>
                    <option value="goldbar">Gold Bar Mode</option>
                </select>
            </div>
        </div>

        <!-- Material -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">
                Material</h3>
            <div>
                <label class="text-[10px] text-slate-400 mb-2 uppercase font-bold">Type</label>
                <select id="material-select"
                    class="w-full bg-slate-800 border border-slate-700 rounded-xl p-2 text-sm text-white outline-none">
                    <option value="metallic">Metallic</option>
                    <option value="glass">Glass</option>
                    <option value="plastic">Plastic</option>
                    <option value="cloth">Cloth</option>
                    <option value="wood">Wood</option>
                </select>
            </div>
            <div id="presets-container">
                <label id="presets-label" class="text-[10px] text-slate-400 mb-2 uppercase font-bold">Metallic
                    Presets</label>
                <div id="material-presets" class="grid grid-cols-2 gap-2">
                    <!-- Presets will be injected here -->
                </div>
            </div>
        </div>

        <!-- Fine Tuning -->
        <div class="space-y-4">
            <h3 class="text-[10px] font-bold text-slate-500 uppercase tracking-widest border-b border-slate-800 pb-2">
                Fine Tuning</h3>
            <div>
                <label class="flex justify-between text-[10px] text-slate-400 mb-2 uppercase font-bold">Roughness <span
                        id="rough-val">0.23</span></label>
                <input type="range" id="rough-range" min="0" max="1.0" step="0.01" value="0.23" class="w-full">
            </div>
            <div>
                <label class="flex justify-between text-[10px] text-slate-400 mb-2 uppercase font-bold">RGB Intensity
                    <span id="rgb-val">0.5</span></label>
                <input type="range" id="rgb-range" min="0" max="5.0" step="0.1" value="0.5" class="w-full">
            </div>
            <div>
                <label class="flex justify-between text-[10px] text-slate-400 mb-2 uppercase font-bold">Depth <span
                        id="depth-val">2.0</span></label>
                <input type="range" id="depth-range" min="0.1" max="10.0" step="0.1" value="2.0" class="w-full">
            </div>
            <div>
                <label class="flex justify-between text-[10px] text-slate-400 mb-2 uppercase font-bold">Zoom <span
                        id="zoom-val">45</span></label>
                <input type="range" id="zoom-range" min="15" max="150" step="1" value="45" class="w-full">
            </div>
        </div>

        <!-- Action -->
        <div class="flex flex-col justify-end space-y-3">
            <div class="flex items-center justify-between bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 font-bold uppercase">Auto Rotation</span>
                <input type="checkbox" id="rotate-toggle" class="w-4 h-4 accent-blue-500 cursor-pointer">
            </div>
            <div class="flex items-center justify-between bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 font-bold uppercase">Light Background</span>
                <input type="checkbox" id="bg-toggle" class="w-4 h-4 accent-blue-500 cursor-pointer">
            </div>
            <div class="flex items-center justify-between bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                <span class="text-[10px] text-slate-400 font-bold uppercase">Show Backdrop</span>
                <input type="checkbox" id="backdrop-toggle" class="w-4 h-4 accent-indigo-500 cursor-pointer">
            </div>
            <button id="regen-btn"
                class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl uppercase text-[11px] tracking-[0.2em] transition-all shadow-lg active:scale-95">Update
                Scene</button>
            <button id="download-btn"
                class="w-full bg-slate-800 border border-slate-700 text-slate-400 py-2 rounded-xl text-[10px] uppercase hover:text-white transition-all italic font-bold">Capture
                PNG</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, mesh, currentFont = null, pmremGenerator, currentEnvMap;
        let backdrop;
        let fonts = {};
        let uniforms = {
            uRgbIntensity: { value: 0.2 },
            uFresnelPower: { value: 2.0 },
            uTime: { value: 0 }
        };

        const materialPresets = {
            metallic: [
                { name: 'Gold', color: '#ffcc33', rough: 0.18, metal: 1.0 },
                { name: 'Silver', color: '#ffffff', rough: 0.05, metal: 1.0 },
                { name: 'Platinum', color: '#d1d5db', rough: 0.15, metal: 1.0 },
                { name: 'Copper', color: '#b87333', rough: 0.35, metal: 1.0 }
            ],
            glass: [
                { name: 'Clear', color: '#ffffff', rough: 0.0, transmission: 1.0, ior: 1.5 },
                { name: 'Frosted', color: '#ffffff', rough: 0.4, transmission: 1.0, ior: 1.5 },
                { name: 'Emerald', color: '#50c878', rough: 0.1, transmission: 0.9, ior: 1.7 },
                { name: 'Ruby', color: '#e0115f', rough: 0.1, transmission: 0.9, ior: 1.8 }
            ],
            plastic: [
                { name: 'Glossy Red', color: '#ff0000', rough: 0.1, clearcoat: 1.0 },
                { name: 'Matte Blue', color: '#1e40af', rough: 0.5, clearcoat: 0.0 },
                { name: 'Neon Green', color: '#39ff14', rough: 0.2, clearcoat: 0.5 },
                { name: 'Black PVC', color: '#111111', rough: 0.3, clearcoat: 1.0 }
            ],
            cloth: [
                { name: 'Silk', color: '#fef3c7', rough: 0.3, sheen: 1.0 },
                { name: 'Denim', color: '#3b82f6', rough: 0.8, sheen: 0.0 },
                { name: 'Velvet', color: '#4c1d95', rough: 0.6, sheen: 1.0 },
                { name: 'Cotton', color: '#f8fafc', rough: 0.9, sheen: 0.0 }
            ],
            wood: [
                { name: 'Oak', color: '#b58b4c', rough: 0.7 },
                { name: 'Walnut', color: '#3d2b1f', rough: 0.6 },
                { name: 'Mahogany', color: '#4a0e0e', rough: 0.5 },
                { name: 'Pine', color: '#e5c07b', rough: 0.8 }
            ]
        };

        const canvas = document.getElementById('main-canvas');
        const loading = document.getElementById('loading');
        const svgLoader = new THREE.SVGLoader();
        const fontLoader = new THREE.FontLoader();

        let targetZ = 45;

        function initThree() {
            scene = new THREE.Scene();

            // Direct illumination to support diffuse materials like Cloth
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(30, 40, 50);
            scene.add(dirLight);

            const fillLight = new THREE.PointLight(0xffffff, 0.3);
            fillLight.position.set(-30, -20, 30);
            scene.add(fillLight);

            camera = new THREE.PerspectiveCamera(24, 1280 / 720, 0.1, 1000);
            camera.position.set(0, 0, targetZ);

            renderer = new THREE.WebGLRenderer({
                canvas, antialias: true, preserveDrawingBuffer: true, alpha: true
            });
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setSize(1280, 720);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.0;
            renderer.outputEncoding = THREE.sRGBEncoding;

            pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            createStudioEnv();
            createBackdrop();
            updatePresetsUI(); // Initialize presets UI

            const fs = document.getElementById('font-select');
            if (fs) loadFont(fs.value);

            setupInteractions();
            animate();
        }

        function updatePresetsUI() {
            const type = document.getElementById('material-select').value;
            const container = document.getElementById('material-presets');
            const label = document.getElementById('presets-label');

            label.innerText = `${type.charAt(0).toUpperCase() + type.slice(1)} Presets`;
            container.innerHTML = '';

            const presets = materialPresets[type];
            presets.forEach(p => {
                const btn = document.createElement('button');
                btn.className = 'btn-preset border border-slate-700 hover:border-slate-400 transition-colors';
                btn.style.backgroundColor = p.color;
                btn.style.color = getContrastYIQ(p.color);
                btn.innerText = p.name;
                btn.onclick = () => applyPreset(p);
                container.appendChild(btn);
            });

            // Auto-apply first preset on type change
            if (presets.length > 0) applyPreset(presets[0]);
        }

        function createBackdrop() {
            // Create a procedural checkerboard texture for refraction testing
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Draw grid
            ctx.fillStyle = '#111111';
            ctx.fillRect(0, 0, size, size);
            ctx.fillStyle = '#222222';
            const cellSize = size / 8;
            for (let y = 0; y < 8; y++) {
                for (let x = 0; x < 8; x++) {
                    if ((x + y) % 2 === 0) {
                        ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
                    }
                }
            }
            // Add some highlights
            ctx.strokeStyle = '#334466';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, size, size);

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(4, 4);

            const geometry = new THREE.PlaneGeometry(200, 200);
            const material = new THREE.MeshBasicMaterial({
                map: texture,
                transparent: true,
                opacity: 0.5
            });

            backdrop = new THREE.Mesh(geometry, material);
            backdrop.position.z = -20; // Place behind the logo
            backdrop.visible = false;
            scene.add(backdrop);
        }

        function getContrastYIQ(hexcolor) {
            hexcolor = hexcolor.replace("#", "");
            var r = parseInt(hexcolor.substr(0, 2), 16);
            var g = parseInt(hexcolor.substr(2, 2), 16);
            var b = parseInt(hexcolor.substr(4, 2), 16);
            var yiq = ((r * 299) + (g * 587) + (b * 114)) / 1000;
            return (yiq >= 128) ? 'black' : 'white';
        }

        function applyPreset(p) {
            const type = document.getElementById('material-select').value;
            const rr = document.getElementById('rough-range');
            const rv = document.getElementById('rough-val');

            if (rr) rr.value = p.rough;
            if (rv) rv.innerText = p.rough.toFixed(2);

            generate(); // Regenerate to apply all properties
            if (mesh) {
                mesh.material.color.set(p.color);
            }
        }

        async function loadFont(fontPath) {
            if (fonts[fontPath]) {
                currentFont = fonts[fontPath];
                generate();
                return;
            }

            loading.style.display = 'flex';
            document.getElementById('loading-text').innerText = "Loading Font...";

            try {
                let loadedFont;
                let fontType;

                if (fontPath.endsWith('.ttf')) {
                    const response = await fetch(fontPath);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const buffer = await response.arrayBuffer();
                    loadedFont = opentype.parse(buffer);
                    fontType = 'opentype';
                } else {
                    let url = fontPath.startsWith('http') ? `${fontPath}.typeface.json` : `https://raw.githubusercontent.com/mrdoob/three.js/master/examples/fonts/${fontPath}.typeface.json`;
                    loadedFont = await new Promise((resolve, reject) => {
                        fontLoader.load(url, resolve, undefined, reject);
                    });
                    fontType = 'threejs';
                }

                fonts[fontPath] = { font: loadedFont, type: fontType };
                currentFont = fonts[fontPath];
                generate();

            } catch (err) {
                console.error("Font loading failed:", err);
                loading.style.display = 'none';
                if (fontPath !== document.getElementById('font-select').options[0].value) {
                    loadFont(document.getElementById('font-select').options[0].value);
                }
            }
        }

        function createStudioEnv() {
            const envScene = new THREE.Scene();
            // Use high-intensity colors for fake HDR effect in PMREM
            const lightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const brightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

            const lights = [
                { pos: [0, 50, -20], rot: [Math.PI / 2, 0, 0], scale: [20, 100], mat: brightMat },
                { pos: [-50, 0, 10], rot: [0, Math.PI / 2, 0], scale: [100, 40], mat: lightMat },
                { pos: [50, 0, 10], rot: [0, -Math.PI / 2, 0], scale: [100, 40], mat: lightMat },
                { pos: [0, -50, 10], rot: [-Math.PI / 2, 0, 0], scale: [100, 20], mat: lightMat }
            ];
            lights.forEach(l => {
                const p = new THREE.Mesh(new THREE.PlaneGeometry(...l.scale), l.mat);
                p.position.set(...l.pos); p.rotation.set(...l.rot);
                envScene.add(p);
            });
            currentEnvMap = pmremGenerator.fromScene(envScene).texture;
        }

        function generate() {
            if (!currentFont) return;
            loading.style.display = 'flex';
            document.getElementById('loading-text').innerText = "Generating 3D model...";

            let prevTransform = null;
            if (mesh) {
                prevTransform = {
                    rotation: mesh.rotation.clone(),
                    position: mesh.position.clone()
                };
                scene.remove(mesh);
                if (mesh.geometry) mesh.geometry.dispose();
                if (mesh.material) mesh.material.dispose();
            }

            const shapeType = document.getElementById('shape-select').value;
            const text = document.getElementById('text-input').value.trim();
            const depthVal = parseFloat(document.getElementById('depth-range').value);
            const materialType = document.getElementById('material-select').value;

            let geometry;
            if (shapeType === 'text') {
                if (currentFont.type === 'opentype') {
                    if (text === "") {
                        geometry = new THREE.BoxGeometry(1, 1, 1);
                    } else {
                        const fontSize = 100;
                        const shapes = [];
                        for (let i = 0; i < text.length; i++) {
                            const path = currentFont.font.getPath(text[i], 0, 0, fontSize);
                            const charWidth = path.getBoundingBox().x2 - path.getBoundingBox().x1;
                            const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" width="${charWidth}" height="${fontSize}"><path transform="translate(${i * fontSize * 0.9}, 0)" d="${path.toPathData(1)}" /></svg>`;
                            const data = svgLoader.parse(svgMarkup);
                            data.paths.forEach(p => shapes.push(...p.toShapes(true)));
                        }
                        geometry = new THREE.ExtrudeGeometry(shapes, { steps: 1, depth: depthVal * 4, bevelEnabled: true, bevelThickness: 5.0, bevelSize: 2.0, bevelOffset: 0, bevelSegments: 4 });
                        geometry.rotateX(Math.PI);
                    }
                } else {
                    geometry = new THREE.TextGeometry(text || " ", { font: currentFont.font, size: 8, height: depthVal / 2, curveSegments: 12, bevelEnabled: true, bevelThickness: 0.5, bevelSize: 0.3, bevelSegments: 4 });
                }
                geometry.center();
            } else {
                const shape = new THREE.Shape();
                const w = 16, d = 8, h = 3.0, r = 1.0;
                shape.moveTo(-w / 2 + r, -d / 2);
                shape.lineTo(w / 2 - r, -d / 2);
                shape.quadraticCurveTo(w / 2, -d / 2, w / 2, -d / 2 + r);
                shape.lineTo(w / 2, d / 2 - r);
                shape.quadraticCurveTo(w / 2, d / 2, w / 2 - r, d / 2);
                shape.lineTo(-w / 2 + r, d / 2);
                shape.quadraticCurveTo(-w / 2, d / 2, -w / 2, d / 2 - r);
                shape.lineTo(-w / 2, -d / 2 + r);
                shape.quadraticCurveTo(-w / 2, -d / 2, -w / 2 + r, -d / 2);
                geometry = new THREE.ExtrudeGeometry(shape, { steps: 1, depth: h, bevelEnabled: true, bevelThickness: 0.6, bevelSize: 0.6, bevelSegments: 8 });
                geometry.rotateX(-Math.PI / 2);
                geometry.center();
            }

            geometry.computeBoundingBox();
            const bSize = new THREE.Vector3();
            geometry.boundingBox.getSize(bSize);
            const maxD = Math.max(bSize.x, bSize.y, bSize.z);
            if (maxD > 35) geometry.scale(35 / maxD, 35 / maxD, 35 / maxD);

            // Configure Material based on type
            let envIntensity = 1.0; // Default for diffuse materials (Wood, Cloth, Plastic)
            if (materialType === 'metallic') envIntensity = 4.0;
            if (materialType === 'glass') envIntensity = 2.0;

            const matProps = {
                color: mesh ? mesh.material.color : 0xffcc33,
                roughness: parseFloat(document.getElementById('rough-range').value),
                envMap: currentEnvMap,
                envMapIntensity: envIntensity
            };

            let material;
            const isLightBg = document.getElementById('bg-toggle') && document.getElementById('bg-toggle').checked;

            if (materialType === 'glass') {
                material = new THREE.MeshPhysicalMaterial({
                    ...matProps,
                    metalness: 0.1,
                    transmission: 1.0,
                    ior: 1.52,
                    thickness: 3.0,
                    transparent: true,
                    opacity: 1,
                    clearcoat: 1.0,
                    clearcoatRoughness: 0.05
                });
                if (!isLightBg) material.emissive.set(0x222222); // Help visibility on dark background
            } else if (materialType === 'metallic') {
                material = new THREE.MeshPhysicalMaterial({ ...matProps, metalness: 1.0 });
            } else if (materialType === 'plastic') {
                material = new THREE.MeshPhysicalMaterial({ ...matProps, metalness: 0, clearcoat: 1.0, clearcoatRoughness: 0.1 });
            } else if (materialType === 'cloth') {
                // Natural cloth appearance with balanced lighting
                material = new THREE.MeshPhysicalMaterial({
                    ...matProps,
                    color: new THREE.Color(matProps.color),
                    metalness: 0,
                    sheen: new THREE.Color(matProps.color).multiplyScalar(0.2) // Subtle sheen
                });
            } else { // Wood
                material = new THREE.MeshPhysicalMaterial({ ...matProps, metalness: 0, reflectance: 0.2 });
            }

            // Update backdrop
            if (backdrop) {
                backdrop.visible = document.getElementById('backdrop-toggle').checked;
            }

            material.onBeforeCompile = (shader) => {
                shader.uniforms.uRgbIntensity = uniforms.uRgbIntensity;
                shader.uniforms.uFresnelPower = uniforms.uFresnelPower;
                shader.uniforms.uTime = uniforms.uTime;

                shader.vertexShader = shader.vertexShader.replace(
                    'void main() {',
                    `
                    varying vec3 vNormalW;
                    varying vec3 vViewDirW;
                    void main() {
                    `
                ).replace(
                    '#include <worldpos_vertex>',
                    `
                    #include <worldpos_vertex>
                    vec4 localWorldPosition = modelMatrix * vec4( transformed, 1.0 );
                    vNormalW = normalize( vec3( modelMatrix * vec4( objectNormal, 0.0 ) ) );
                    vViewDirW = normalize( cameraPosition - localWorldPosition.xyz );
                    `
                );

                shader.fragmentShader = shader.fragmentShader.replace(
                    'void main() {',
                    `
                    uniform float uRgbIntensity;
                    uniform float uFresnelPower;
                    uniform float uTime;
                    varying vec3 vNormalW;
                    varying vec3 vViewDirW;
                    void main() {
                    `
                ).replace(
                    '#include <dithering_fragment>',
                    `
                    #include <dithering_fragment>
                    float fresnel = pow(1.0 - max(dot(vNormalW, vViewDirW), 0.0), uFresnelPower);
                    vec3 shift;
                    shift.r = fresnel * abs(sin(vNormalW.x * 5.0 + uTime * 0.5));
                    shift.g = fresnel * abs(sin(vNormalW.y * 5.0 + uTime * 0.6 + 2.0));
                    shift.b = fresnel * abs(sin(vNormalW.z * 5.0 + uTime * 0.7 + 4.2));
                    gl_FragColor.rgb += shift * uRgbIntensity;
                    `
                );
            };

            mesh = new THREE.Mesh(geometry, material);
            if (prevTransform) {
                mesh.rotation.copy(prevTransform.rotation);
                mesh.position.copy(prevTransform.position);
            }
            scene.add(mesh);
            setTimeout(() => loading.style.display = 'none', 100);
        }

        function animate() {
            requestAnimationFrame(animate);
            uniforms.uTime.value += 0.01;
            camera.position.z += (targetZ - camera.position.z) * 0.1;
            const rt = document.getElementById('rotate-toggle');
            if (mesh && rt && rt.checked && !isDragging) mesh.rotation.y += 0.005;
            renderer.render(scene, camera);
        }

        function updateZoom(val) {
            targetZ = Math.max(15, Math.min(150, val));
            const zr = document.getElementById('zoom-range');
            const zv = document.getElementById('zoom-val');
            if (zr) zr.value = targetZ;
            if (zv) zv.innerText = Math.round(targetZ);
        }

        let isDragging = false, isPanning = false, prevMouse = { x: 0, y: 0 };
        function setupInteractions() {
            canvas.onmousedown = (e) => {
                if (e.button === 0) {
                    if (e.shiftKey) isPanning = true; else isDragging = true;
                    prevMouse = { x: e.clientX, y: e.clientY };
                }
            };
            window.onmouseup = () => { isDragging = false; isPanning = false; };
            canvas.onmousemove = (e) => {
                if (mesh && (isDragging || isPanning)) {
                    const dx = e.clientX - prevMouse.x, dy = e.clientY - prevMouse.y;
                    if (isDragging) { mesh.rotation.y += dx * 0.01; mesh.rotation.x += dy * 0.01; }
                    else { mesh.position.x += dx * 0.05; mesh.position.y -= dy * 0.05; }
                    prevMouse = { x: e.clientX, y: e.clientY };
                }
            };
            canvas.addEventListener('wheel', (e) => { e.preventDefault(); updateZoom(targetZ + e.deltaY * 0.05); }, { passive: false });
            document.getElementById('zoom-range').oninput = (e) => updateZoom(parseFloat(e.target.value));
            document.getElementById('rough-range').oninput = (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('rough-val').innerText = val.toFixed(2);
                if (mesh) mesh.material.roughness = val;
            };
            document.getElementById('depth-range').oninput = (e) => { document.getElementById('depth-val').innerText = e.target.value; };
            document.getElementById('rgb-range').oninput = (e) => {
                const val = parseFloat(e.target.value);
                document.getElementById('rgb-val').innerText = val.toFixed(1);
                uniforms.uRgbIntensity.value = val;
            };
            document.getElementById('backdrop-toggle').onchange = (e) => {
                if (backdrop) backdrop.visible = e.target.checked;
            };
            document.getElementById('material-select').onchange = () => { updatePresetsUI(); generate(); };
            document.getElementById('font-select').onchange = (e) => loadFont(e.target.value);
            document.getElementById('regen-btn').onclick = generate;
            document.getElementById('shape-select').onchange = generate;
            document.getElementById('bg-toggle').onchange = () => {
                const isLight = document.getElementById('bg-toggle').checked;
                renderer.setClearColor(isLight ? 0xcccccc : 0x000000, isLight ? 1 : 0);
                generate();
            };
            document.getElementById('download-btn').onclick = () => {
                const link = document.createElement('a');
                link.download = `logo-3d-${Date.now()}.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
        }

        window.onload = initThree;
    </script>
</body>

</html>
